<title>Privacy policy – Ce Mancam backup</title>
<h1>Privacy policy</h1>
<p>Ce Mancam backup is used only by its owner. It uploads backup files to the owner's own Google Drive and can access only the files it created there.</p>
<p>It collects no data from anyone, stores nothing elsewhere, and shares nothing with third parties.</p>
